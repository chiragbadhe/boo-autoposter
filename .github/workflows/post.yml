name: Boo autopost

on:
  schedule:
    # Five possible slots a day (UTC; IST = UTC + 5:30):
    # 9:13 AM, 11:52 AM, 2:26 PM, 5:38 PM, 8:44 PM IST.
    # scripts/slot.py picks 1, 2 or 3 of them at random each day and adds a
    # random 0-25 min wait, so posting days and times never look the same.
    # If you edit these lines, copy them into SLOTS below too.
    - cron: "43 3 * * *"
    - cron: "22 6 * * *"
    - cron: "56 8 * * *"
    - cron: "8 12 * * *"
    - cron: "14 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what would post, post nothing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: boo-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether this slot posts today
        id: slot
        env:
          SCHEDULE: ${{ github.event.schedule }}
          SLOTS: |
            43 3 * * *
            22 6 * * *
            56 8 * * *
            8 12 * * *
            14 15 * * *
        run: python3 scripts/slot.py

      - name: Random wait
        if: steps.slot.outputs.go == 'true' && steps.slot.outputs.delay != '0'
        run: sleep ${{ steps.slot.outputs.delay }}

      - name: Catch up with the latest queue
        if: steps.slot.outputs.go == 'true'
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Publish next queued post
        id: publish
        if: steps.slot.outputs.go == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GRAPH_HOST: ${{ vars.GRAPH_HOST || 'graph.instagram.com' }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
        run: |
          export IMAGE_BASE_URL="https://cdn.jsdelivr.net/gh/${{ github.repository }}@$(git rev-parse HEAD)"
          python3 scripts/post.py

      - name: Move posted folder out of the queue
        if: steps.publish.outputs.posted != ''
        env:
          POSTED: ${{ steps.publish.outputs.posted }}
        run: |
          git config user.name "boo-autopost"
          git config user.email "boo-autopost@users.noreply.github.com"
          mkdir -p posted
          git mv "queue/$POSTED" "posted/$POSTED"
          git commit -m "Posted $POSTED"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
